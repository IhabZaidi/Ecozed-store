services:
  db:
    image: postgres:16-alpine
    container_name: ecozed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecozed
    ports:
      - "5432:5432"
    volumes:
      - ecozed-pgdata:/var/lib/postgresql/data

volumes:
  ecozed-pgdata:
